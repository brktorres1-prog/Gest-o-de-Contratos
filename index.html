<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Dashboard - Gestão de Contrato</title>

<link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="sidebar">
  <h2>Gestão de Contrato</h2>
  <ul>
    <li>Dashboard</li>
    <li>Clientes</li>
    <li>Contratos</li>
    <li>Transportadores</li>
    <li>Sinistros</li>
    <li>Planos de Ação</li>
  </ul>
</div>

<div class="main">

  <h1>Dashboard</h1>

  <div class="cards">
    <div class="card">
      <h3>Clientes</h3>
      <p id="clientes">0</p>
    </div>

    <div class="card">
      <h3>Sinistros</h3>
      <p id="sinistros">0</p>
    </div>

    <div class="card">
      <h3>Transportadores</h3>
      <p id="transportadores">0</p>
    </div>

    <div class="card">
      <h3>Planos de Ação</h3>
      <p id="planos">0</p>
    </div>
  </div>

</div>

<script src="js/app.js"></script>

</body>
</html>
